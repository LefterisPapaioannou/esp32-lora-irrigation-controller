esphome:
  name: gateway-node
  friendly_name: gateway-node

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "API_Key"

ota:
  - platform: esphome

wifi:
  ssid: "SSID"
  password: "Password"
  ap:
    ssid: "Fallback_Hotspot_SSID"
    password: "Fallback_Hotspot_Password"

captive_portal:

# ------------------------------------------------------------------------------
# GLOBALS
# ------------------------------------------------------------------------------
globals:
  - id: relay_bitmask
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: remote_last_seen
    type: uint32_t
    restore_value: no
    initial_value: "0"

# ------------------------------------------------------------------------------
# SENSORS  (RSSI, SNR, Remote Online)
# ------------------------------------------------------------------------------
sensor:
  - platform: template
    id: lora_rssi
    name: "LoRa RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    icon: mdi:signal
    device_class: signal_strength
    state_class: measurement

  - platform: template
    id: lora_snr
    name: "LoRa SNR"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    state_class: measurement

binary_sensor:
  - platform: template
    id: remote_online
    name: "Remote Node Online"
    device_class: connectivity

# ------------------------------------------------------------------------------
# SPI
# ------------------------------------------------------------------------------
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO20
  miso_pin: GPIO19

# ------------------------------------------------------------------------------
# LoRa radio
# ------------------------------------------------------------------------------
sx127x:
  id: lora_radio
  setup_priority: 800
  cs_pin: GPIO21
  dio0_pin: GPIO22
  rst_pin: GPIO15
  frequency: 868.0MHz
  modulation: LORA
  sync_value: 0x4A
  preamble_size: 8
  bandwidth: 125_0kHz
  spreading_factor: 7
  crc_enable: true
  pa_pin: BOOST
  pa_power: 17
  rx_start: true

  on_packet:
    then:
      - lambda: |-
          if (x.size() != 5 || x[0] != 0x55 || x[1] != 0xAA) return;

          static switch_::Switch *relays[24] = {
              id(relay1),  id(relay2),  id(relay3),  id(relay4),  id(relay5),  id(relay6),
              id(relay7),  id(relay8),  id(relay9),  id(relay10), id(relay11), id(relay12),
              id(relay13), id(relay14), id(relay15), id(relay16), id(relay17), id(relay18),
              id(relay19), id(relay20), id(relay21), id(relay22), id(relay23), id(relay24),
          };

          uint32_t ack = (uint32_t)x[2] | ((uint32_t)x[3] << 8) | ((uint32_t)x[4] << 16);
          id(remote_last_seen) = millis();
          ESP_LOGI("gateway", "ACK from remote, bitmask=0x%06X  RSSI=%.0f dBm  SNR=%.1f dB", ack, rssi, snr);
          id(lora_rssi).publish_state(rssi);
          id(lora_snr).publish_state(snr);
          id(remote_online).publish_state(true);

          for (uint8_t i = 0; i < 24; i++) {
            relays[i]->publish_state((ack >> i) & 1);
          }

# ------------------------------------------------------------------------------
# SCRIPT
# ------------------------------------------------------------------------------
script:
  - id: send_relay_command
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("gateway", "TX relay command bitmask=0x%06X", id(relay_bitmask));
      - sx127x.send_packet:
          id: lora_radio
          data: !lambda |-
            uint32_t m = id(relay_bitmask);
            return { 0x55, 0xAA, (uint8_t)(m & 0xFF), (uint8_t)((m >> 8) & 0xFF), (uint8_t)((m >> 16) & 0xFF) };

# ------------------------------------------------------------------------------
# INTERVAL – online status check + 30s keepalive ping
# ------------------------------------------------------------------------------
interval:
  - interval: 10s
    then:
      - lambda: |-
          bool online = id(remote_last_seen) > 0 &&
                        (millis() - id(remote_last_seen)) < 60000;
          id(remote_online).publish_state(online);
          if (!online) {
            ESP_LOGW("gateway", "Remote node has not responded in >60s");
          }

  - interval: 30s
    then:
      - sx127x.send_packet:
          id: lora_radio
          data: !lambda |-
            uint32_t m = id(relay_bitmask);
            return { 0x55, 0xAA, (uint8_t)(m & 0xFF), (uint8_t)((m >> 8) & 0xFF), (uint8_t)((m >> 16) & 0xFF) };

# ------------------------------------------------------------------------------
# VIRTUAL SWITCHES
# ------------------------------------------------------------------------------
switch:
  - platform: template
    id: relay1
    name: "Relay 1"
    icon: mdi:water-pump
    optimistic: false
    turn_on_action:
      - lambda: id(relay_bitmask) |=  ((uint32_t)1 << 0);
      - script.execute: send_relay_command
    turn_off_action:
      - lambda: id(relay_bitmask) &= ~((uint32_t)1 << 0);
      - script.execute: send_relay_command

  - platform: template
